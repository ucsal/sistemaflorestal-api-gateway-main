server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          # ── Identificação (auth) ───────────────────────────────────────────
          - id: identificacao-service
            uri: lb://identificacao-service
            predicates:
              - Path=/api/identificacao/**
            filters:
              - StripPrefix=1

          # ── Operações ─────────────────────────────────────────────────────
          - id: operacoes-service
            uri: lb://operacoes-service
            predicates:
              - Path=/api/operacoes/**
            filters:
              - StripPrefix=1

          # ── Cadastro ──────────────────────────────────────────────────────
          - id: cadastro-service
            uri: lb://cadastro-service
            predicates:
              - Path=/api/cadastro/**
            filters:
              - StripPrefix=1

          # ── Auditoria ─────────────────────────────────────────────────────
          - id: auditoria-service
            uri: lb://auditoria-service
            predicates:
              - Path=/api/auditoria/**
            filters:
              - StripPrefix=1

# Eureka
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

# JWT
jwt:
  secret: florestal-sistema-secret-key-2025-muito-segura-minimo-256-bits
  expiration: 86400000   # 24h em ms

# SpringDoc / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Gateway
        url: /v3/api-docs
      - name: Identificacao
        url: /api/identificacao/v3/api-docs
      - name: Operacoes
        url: /api/operacoes/v3/api-docs
      - name: Cadastro
        url: /api/cadastro/v3/api-docs
      - name: Auditoria
        url: /api/auditoria/v3/api-docs
  api-docs:
    enabled: true

logging:
  level:
    com.florestal.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
